
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルピのマイファミリー｜Winter Calendar 2026</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  color: #526078;
  background:
    linear-gradient(rgba(240, 245, 255, 0.25), rgba(240, 245, 255, 0.25)),
    url("./冬夜の輝く雪景色.png") center center / cover fixed no-repeat;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 45px 15px 25px;
}

h1 {
    color: #263b68;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.85);
}

.subtitle {
    color: #52658f;
    letter-spacing: 3px;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
}

.message {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #34466f;
    line-height: 1.9;
    padding: 0 15px 25px;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
}

.calendar {
  max-width: 850px;
  margin: auto;
  padding: 15px 20px 50px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
}

.door {
  width: 100%;
  min-height: 145px;
  aspect-ratio: 1 / 1.1;
  border: none;
  border-radius: 0;
  background: url("./door.png") center center / contain no-repeat;
  background-color: transparent;
  color: #fff;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  text-shadow: 0 2px 5px #172b65;
  transition: transform 0.2s;
  display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
width: 100%;
padding-bottom: 35px;
box-sizing: border-box;
}

.door:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}

.door > span:not(.door-number) {
    display: none;
}

.door {
    position: relative;
}

.door .door-number {
    display: block !important;
    position: absolute;
    top: 38%;
    left: 8px;
right: -8px;
width: auto;
    transform: none;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 5px #172b65;
    z-index: 2;
}

.door.special {
  background-color: transparent;
  border: none;
}

footer {
  text-align: center;
  padding: 10px 15px 45px;
  color: #a2a1b5;
  font-size: 12px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(68,75,100,0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal.show { display: flex; }

.modal-content {
  background: #fff;
  border-radius: 20px;
  padding: 35px 25px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 12px 40px rgba(50,50,90,0.2);
}

.modal-content h2 {
  color: #8985ad;
}

.modal-content p {
  line-height: 2;
  font-size: 15px;
}

.close {
  margin-top: 15px;
  padding: 10px 28px;
  border: none;
  border-radius: 20px;
  background: #e9e8f5;
  color: #747795;
  cursor: pointer;
}

@media (max-width: 480px) {
  .calendar { gap: 8px; padding: 10px 12px 35px; }
  .door { min-height: 78px; font-size: 23px; }

  .door .door-number {
    left: 0;
    right: 0;
    width: 100%;
  }
</style>
</head>

<body>

<header>
  <div class="subtitle">LUPI'S FAMILY PRESENTS</div>
  <h1>Family Calendar</h1>
  <div class="subtitle">DECEMBER 2026</div>
</header>

<div class="message">
  12月の小さな扉を、ひとつずつ開けてみよう。<br>
  今日はどんな出会いが待っているかな？
</div>

<main class="calendar" id="calendar"></main>

<footer>
  A little happiness for every day.<br>
  Lupi's Family Winter Calendar 2026
</footer>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <button class="close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
const calendar = document.getElementById("calendar");

for (let day = 1; day <= 31; day++) {
  const door = document.createElement("button");
  door.className = day === 31 ? "door special" : "door";
  door.innerHTML = `<span class="door-number">${day}</span><span>${day === 31 ? "FINAL DAY ✨" : "OPEN THE DOOR"}</span>`;
  door.onclick = () => openModal(day);
  calendar.appendChild(door);
}

function openModal(day) {
  document.getElementById("modal-title").textContent =
    day === 31 ? "December 31 ✨" : `December ${day}`;

  document.getElementById("modal-text").textContent =
    day === 31
      ? "みんな、今年も一緒に過ごしてくれてありがとう！また来年もよろしくね。"
      : `これは${day}日目の扉。これからどんな物語が待っているかな？`;

  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}
</script>

</body>
</html>
