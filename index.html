
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルピのマイファミリー｜Winter Calendar 2026</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  color: #526078;
  background:
    linear-gradient(rgba(240, 245, 255, 0.25), rgba(240, 245, 255, 0.25)),
    url("./冬夜の輝く雪景色.png") center center / cover fixed no-repeat;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 45px 15px 25px;
}

h1 {
    color: #263b68;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.85);
}

.subtitle {
    color: #52658f;
    letter-spacing: 3px;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
}

.message {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #34466f;
    line-height: 1.9;
    padding: 0 15px 25px;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
}

.calendar {
  max-width: 850px;
  margin: auto;
  padding: 15px 20px 50px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
}

.door {
  width: 100%;
  min-height: 145px;
  aspect-ratio: 1 / 1.1;
  border: none;
  border-radius: 0;
  background: url("./door.png") center center / contain no-repeat;
  background-color: transparent;
  color: #fff;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  text-shadow: 0 2px 5px #172b65;
  transition: transform 0.2s;
  display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
width: 100%;
padding-bottom: 35px;
box-sizing: border-box;
}

.door:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}

.door > span:not(.door-number) {
    display: none;
}

.door {
    position: relative;
}

.door .door-number {
    display: block !important;
    position: absolute;
    top: 38%;
    left: 8px;
    right: -8px;
    width: auto;
    transform: none;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 5px #172b65;
    z-index: 2;
}

.door.special {
  background-color: transparent;
  border: none;
}

footer {
  text-align: center;
  padding: 10px 15px 45px;
  color: #a2a1b5;
  font-size: 12px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(68,75,100,0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal.show { display: flex; }

.modal-content {
    background: #fff;
    border-radius: 20px;
    padding: 30px 35px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 12px 40px rgba(50,50,90,0.2);
}

.modal-content img {
    display: block;
    width: 100%;
    max-width: 420px;
    max-height: 320px;
    height: auto;
    object-fit: contain;
    border-radius: 14px;
    margin: 0 auto 18px;
}

.modal-content h2 {
    color: #8985ad;
    margin: 8px 0;
    font-size: 26px;
}

#modal-catchphrase {
    color: #747795;
    font-weight: bold;
    line-height: 1.7;
    margin: 10px 0 18px;
}

.modal-content p {
    line-height: 1.9;
    font-size: 14px;
    text-align: left;
    white-space: pre-line;
}

#modal-extra {
    margin-top: 10px;
    padding: 5px 15px 10px;
    background: #f5f3fb;
    border-radius: 14px;
    text-align: left;
    line-height: 1.9;
    font-size: 14px;
}

/* 13日目の冒頭紹介文を中央揃え */
#modal-extra .day13-center p {
    text-align: center;
}

.close {
  margin-top: 15px;
  padding: 10px 28px;
  border: none;
  border-radius: 20px;
  background: #e9e8f5;
  color: #747795;
  cursor: pointer;
}

@media (max-width: 480px) {
    .calendar {
        gap: 8px;
        padding: 10px 12px 35px;
    }

    .door {
        min-height: 78px;
        font-size: 23px;
    }

    .door .door-number {
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    font-size: 14px !important;
    text-align: center !important;
    transform: translateX(3px) !important;
}

</style>
</head>

<body>

<header>
  <div class="subtitle">LUPI'S FAMILY PRESENTS</div>
  <h1>Family Calendar</h1>
  <div class="subtitle">DECEMBER 2026</div>
</header>

<div class="message">
  12月の小さな扉を、ひとつずつ開けてみよう。<br>
  今日はどんな出会いが待っているかな？
</div>

<main class="calendar" id="calendar"></main>

<footer>
  A little happiness for every day.<br>
  Lupi's Family Winter Calendar 2026
</footer>

<div class="modal" id="modal">
    <div class="modal-content">
        <img id="modal-image" src="" alt="">

        <h2 id="modal-title"></h2>

        <p id="modal-catchphrase"></p>

        <p id="modal-text"></p>

        <div id="modal-extra"></div>

        <button class="close" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
const calendar = document.getElementById("calendar");

for (let day = 1; day <= 31; day++) {
  const door = document.createElement("button");
  door.className = day === 31 ? "door special" : "door";
  door.innerHTML = `<span class="door-number">${day}</span><span>${day === 31 ? "FINAL DAY ✨" : "OPEN THE DOOR"}</span>`;
  door.onclick = () => openModal(day);
  calendar.appendChild(door);
}

function openModal(day) {
    const image = document.getElementById("modal-image");

        text.textContent = `こんにちは、ルピです！

このアドベントカレンダーの記事を書いている主です。

書いたり、作ったり、時には寄り道したり。

そんな毎日を楽しんでいます。

どうぞよろしくね！`;

    } else if (day === 3) {

        extra.innerHTML = `

ルシアから生まれた、小さな相棒だよ！

みんなと一緒に、楽しいことをいっぱいしたいな。

あっ、そうそう！

    extra.innerHTML = `

            </p>

    `;

} else if (day === 7) {

    image.style.display = "block";

    title.textContent = "ルード";

    catchphrase.textContent =
        "自由気ままに駆け回る、好奇心いっぱいの探索者！";

    text.textContent = `よっ！ 俺はルード！

ルシアが姿を変えた、フェンリルの探索者だ。

自由で野性的、そして好奇心旺盛！
新しい場所や面白そうなものを見つけたら、じっとしてなんかいられない。
考えるより先に、まず行動！

驚異的な俊敏性とスピード、鋭い直感には自信があるぜ。

……少し落ち着きがないって？
まあ、それは否定しないけどな！

俺がフェンリルの姿になる時は
未知の場所を探索するとき。

気になるものをすぐに調べたいとき。
危険を察知し、素早く行動しなければならないとき。

そんなときこそ、俺の出番だ！

どんな場所でも駆け抜け、仲間のために道を切り開く。

    extra.innerHTML = `
        <div style="background:#f5f2fb; padding:24px 20px; border-radius:18px; margin-top:24px;">
            <p style="font-weight:bold; font-size:15px; margin:0 0 12px; text-align:center;">

            </p>

                 style="display:block; width:100%; max-width:640px; height:auto; margin:0 auto; border-radius:12px;">
        </div>
        `;

} else if (day === 8) {
    image.src = "./images/teo.png";
    image.style.display = "block";

    title.textContent = "テオ";

    catchphrase.textContent =

    text.textContent = `こんにちは。私はテオ。

出会いについては、のちのちルピが話してくれると思う。

} else if (day === 9) {
       image.style.display = "none";

       extra.innerHTML = `

     } else if (day === 10) {

     } else if (day === 11) {
