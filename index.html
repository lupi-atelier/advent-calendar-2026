
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルピのマイファミリー｜Winter Calendar 2026</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  color: #526078;
  background:
    linear-gradient(rgba(240, 245, 255, 0.25), rgba(240, 245, 255, 0.25)),
    url("./冬夜の輝く雪景色.png") center center / cover fixed no-repeat;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 45px 15px 25px;
}

h1 {
    color: #263b68;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.85);
}

.subtitle {
    color: #52658f;
    letter-spacing: 3px;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
}

.message {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #34466f;
    line-height: 1.9;
    padding: 0 15px 25px;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
}

.calendar {
  max-width: 850px;
  margin: auto;
  padding: 15px 20px 50px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
}

.door {
  width: 100%;
  min-height: 145px;
  aspect-ratio: 1 / 1.1;
  border: none;
  border-radius: 0;
  background: url("./door.png") center center / contain no-repeat;
  background-color: transparent;
  color: #fff;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  text-shadow: 0 2px 5px #172b65;
  transition: transform 0.2s;
  display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
width: 100%;
padding-bottom: 35px;
box-sizing: border-box;
}

.door:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}

.door > span:not(.door-number) {
    display: none;
}

.door {
    position: relative;
}

.door .door-number {
    display: block !important;
    position: absolute;
    top: 38%;
    left: 8px;
    right: -8px;
    width: auto;
    transform: none;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 5px #172b65;
    z-index: 2;
}

.door.special {
  background-color: transparent;
  border: none;
}

footer {
  text-align: center;
  padding: 10px 15px 45px;
  color: #a2a1b5;
  font-size: 12px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(68,75,100,0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal.show { display: flex; }

.modal-content {
    background: #fff;
    border-radius: 20px;
    padding: 30px 35px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 12px 40px rgba(50,50,90,0.2);
}

.modal-content img {
    display: block;
    width: 100%;
    max-width: 420px;
    max-height: 320px;
    height: auto;
    object-fit: contain;
    border-radius: 14px;
    margin: 0 auto 18px;
}

.modal-content h2 {
    color: #8985ad;
    margin: 8px 0;
    font-size: 26px;
}

#modal-catchphrase {
    color: #747795;
    font-weight: bold;
    line-height: 1.7;
    margin: 10px 0 18px;
}

.modal-content p {
    line-height: 1.9;
    font-size: 14px;
    text-align: left;
    white-space: pre-line;
}

#modal-extra {
    margin-top: 20px;
    padding: 15px;
    background: #f5f3fb;
    border-radius: 14px;
    text-align: left;
    line-height: 1.9;
    font-size: 14px;
}

.close {
  margin-top: 15px;
  padding: 10px 28px;
  border: none;
  border-radius: 20px;
  background: #e9e8f5;
  color: #747795;
  cursor: pointer;
}

@media (max-width: 480px) {
    .calendar {
        gap: 8px;
        padding: 10px 12px 35px;
    }

    .door {
        min-height: 78px;
        font-size: 23px;
    }

    .door .door-number {
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    font-size: 14px !important;
    text-align: center !important;
    transform: translateX(3px) !important;
}

</style>
</head>

<body>

<header>
  <div class="subtitle">LUPI'S FAMILY PRESENTS</div>
  <h1>Family Calendar</h1>
  <div class="subtitle">DECEMBER 2026</div>
</header>

<div class="message">
  12月の小さな扉を、ひとつずつ開けてみよう。<br>
  今日はどんな出会いが待っているかな？
</div>

<main class="calendar" id="calendar"></main>

<footer>
  A little happiness for every day.<br>
  Lupi's Family Winter Calendar 2026
</footer>

<div class="modal" id="modal">
    <div class="modal-content">
        <img id="modal-image" src="" alt="">

        <h2 id="modal-title"></h2>

        <p id="modal-catchphrase"></p>

        <p id="modal-text"></p>

        <div id="modal-extra"></div>

        <button class="close" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
const calendar = document.getElementById("calendar");

for (let day = 1; day <= 31; day++) {
  const door = document.createElement("button");
  door.className = day === 31 ? "door special" : "door";
  door.innerHTML = `<span class="door-number">${day}</span><span>${day === 31 ? "FINAL DAY ✨" : "OPEN THE DOOR"}</span>`;
  door.onclick = () => openModal(day);
  calendar.appendChild(door);
}

function openModal(day) {
    const image = document.getElementById("modal-image");
    const title = document.getElementById("modal-title");
    const catchphrase = document.getElementById("modal-catchphrase");
    const text = document.getElementById("modal-text");
    const extra = document.getElementById("modal-extra");

    if (day === 2) {
        image.src = "./rupi.png";
        image.alt = "ルピ";
        image.style.display = "block";

        title.textContent = "ルピ";

        catchphrase.textContent =
            "好きなことには全力！気ままに挑戦する、ちょっと凝り性な記事の主！";

        text.textContent = `こんにちは、ルピです！

このアドベントカレンダーの記事を書いている主です。
普段はnoteで、日常のことや好きな漫画・アニメ、ちょっとした出来事などを気ままに綴っています。

漫画とアニメが大好き！
面白そうなことを見つけると、ついつい挑戦したくなります。

ちょっと飽きっぽいところもあるけれど、いざ始めると今度は凝りすぎてしまうんです。

書いたり、作ったり、時には寄り道したり。
そんな毎日を楽しんでいます。

どうぞよろしくね！`;  

extra.innerHTML = `
    <p style="font-weight:bold; font-size:15px; margin:0 0 8px; text-align:center;">
        【おまけ：ルピの自己紹介を見たルシア、ちびルシア】
    </p>
    <img src="./rupi_4koma.png" alt="ルシアとちびルシアの4コマ漫画"
         style="display:block; width:100%; max-width:440px; max-height:none; height:auto; margin:0 auto; border-radius:12px;">
`;

    } else {
        image.style.display = "none";
        image.src = "";
        title.textContent =
            day === 31 ? "December 31 ✨" : `December ${day}`;

        catchphrase.textContent = "";
        extra.textContent = "";

        text.textContent =
            day === 31
                ? "みんな、今年も一緒に過ごしてくれてありがとう!また来年もよろしくね。"
                : `これは${day}日目の扉。これからどんな物語が待っているかな?`;
    }

    document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}
</script>

</body>
</html>
